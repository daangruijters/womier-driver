ShortDescription: Unofficial tray driver for the Womier SK75 TMR keyboard with per-key actuation, rapid trigger and lighting profiles that follow your games.
Description: |-
  An unofficial replacement for the vendor's driver app for the Womier SK75 TMR magnetic keyboard. It sets per-key
  actuation points, rapid trigger and the backlight, and switches between profiles automatically when a game
  starts. It talks to the keyboard directly over USB or the 2.4 GHz receiver and updates itself from the GitHub
  releases. Not affiliated with Womier.

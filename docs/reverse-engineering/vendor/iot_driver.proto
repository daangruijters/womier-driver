syntax = "proto3";

package driver;

enum CheckSumType {
  Bit7 = 0;
  Bit8 = 1;
  None = 2;
}

enum DangleDevType {
  DangleDevTypeNone = 0;
  Keyboard = 1;
  Mouse = 2;
}

enum DeviceListChangeType {
  Init = 0;
  Add = 1;
  Remove = 2;
  Change = 3;
}

enum DeviceType {
  YZWKeyboard = 0;
  YZWBoot = 1;
  YZWVender = 2;
}

enum LightType {
  Music2 = 0;
  Screen = 1;
  Other = 2;
}

message AllList {
  repeated bytes data = 1;
  string err_str = 2;
}

message DJDev {
  oneof oneofDev {
    Device dev = 1;
    DangleCommon dangleCommonDev = 2;
  }
}

message DangleCommon {
  DangleStatus keyboard = 1;
  DangleStatus mouse = 2;
  string path = 3;
  uint32 keyboard_id = 5;
  uint32 mouse_id = 6;
  uint32 vid = 7;
  uint32 pid = 8;
}

message DangleStatus {
  oneof dangleDev {
    Empty empty = 1;
    Status24 status = 2;
  }
}

message DeleteItem {
  string dbPath = 1;
  bytes key = 2;
}

message Device {
  DeviceType devType = 1;
  bool is24 = 2;
  string path = 3;
  int32 id = 4;
  uint32 battery = 5;
  bool isOnline = 6;
  uint32 vid = 7;
  uint32 pid = 8;
}

message DeviceList {
  repeated DJDev devList = 1;
  DeviceListChangeType type = 2;
}

message Empty {
}

message GetAll {
  string dbPath = 1;
}

message GetItem {
  string dbPath = 1;
  bytes key = 2;
}

message InsertDb {
  string dbPath = 1;
  bytes key = 2;
  bytes value = 3;
}

message Item {
  bytes value = 1;
  string err_str = 2;
}

message MicrophoneMuteStatus {
  bool is_mute = 1;
  string err = 2;
}

message MuteMicrophone {
  bool need_mute = 1;
}

message OTAUpgrade {
  string devPath = 1;
  bytes file_buf = 2;
}

message Progress {
  float progress = 1;
  string err = 2;
}

message ReadMsg {
  string devicePath = 1;
}

message ResRead {
  string err = 1;
  bytes msg = 2;
}

message ResSend {
  string err = 1;
}

message SendMsg {
  string devicePath = 1;
  bytes msg = 2;
  CheckSumType checkSumType = 3;
  DangleDevType dangleDevType = 4;
}

message SetLight {
  string devicePath = 1;
  LightType lightType = 2;
  uint32 screen_id = 3;
  DangleDevType dangleDevType = 4;
}

message Status24 {
  uint32 battery = 1;
  bool is_online = 2;
}

message SystemInfo {
  uint64 disk_space_total = 1;
  uint64 disk_spce_available = 2;
  uint64 net_work_total_up = 3;
  uint64 net_work_total_down = 4;
  float cpu_temperater = 5;
  uint64 mem_total = 6;
  uint64 mem_used = 7;
  float cpu_usage = 8;
}

message VenderMsg {
  bytes msg = 1;
}

message Version {
  string baseVersion = 1;
  string timeStamp = 2;
}

message WeatherReq {
  string language = 1;
  string address = 2;
}

message WeatherRes {
  string res = 1;
}

message WirelessLoopStatus {
  bool lock = 1;
}

service DriverGrpc {
  rpc watchDevList(Empty) returns (stream DeviceList);
  rpc watchVender(Empty) returns (stream VenderMsg);
  rpc watchSystemInfo(Empty) returns (stream SystemInfo);
  rpc sendMsg(SendMsg) returns (ResSend);
  rpc readMsg(ReadMsg) returns (ResRead);
  rpc sendRawFeature(SendMsg) returns (ResSend);
  rpc readRawFeature(ReadMsg) returns (ResRead);
  rpc setLightType(SetLight) returns (Empty);
  rpc upgradeOTAGATT(OTAUpgrade) returns (stream Progress);
  rpc muteMicrophone(MuteMicrophone) returns (ResSend);
  rpc toggleMicrophoneMute(Empty) returns (ResSend);
  rpc getMicrophoneMute(Empty) returns (MicrophoneMuteStatus);
  rpc changeWirelessLoopStatus(WirelessLoopStatus) returns (Empty);
  rpc insertDb(InsertDb) returns (ResSend);
  rpc deleteItemFromDb(DeleteItem) returns (ResSend);
  rpc getItemFromDb(GetItem) returns (Item);
  rpc getAllKeysFromDb(GetAll) returns (AllList);
  rpc getAllValuesFromDb(GetAll) returns (AllList);
  rpc cleanDev(ReadMsg) returns (ResSend);
  rpc getVersion(Empty) returns (Version);
  rpc getWeather(WeatherReq) returns (WeatherRes);
}

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore WomierDriver.slnx
      - name: Build
        run: dotnet build WomierDriver.slnx -c Release --no-restore
      - name: Test
        run: dotnet test src/WomierDriver.Tests -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Publish portable app
        run: dotnet publish src/WomierDriver.App -c Release -r win-x64 --self-contained true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: WomierDriver-win-x64-portable
          path: publish/WomierDriver.exe
